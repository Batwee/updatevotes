name: Auto Update Votes API

on:
  schedule:
    # Exécution tous les jours à 03h00 UTC
    - cron: '0 3 * * *'
  # Permet de lancer manuellement la mise à jour depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installer les dépendances
        run: npm install axios adm-zip

      - name: Générer le nouveau votes.json
        run: node update.js

      - name: Enregistrer les modifications sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add votes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mise à jour automatique des votes" && git push)
